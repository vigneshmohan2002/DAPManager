<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAP Manager — API Docs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='api-docs.css') }}">
</head>
<body>
    <header class="dap-banner">
        <div>
            <h1>DAP Manager API</h1>
            <p>Offline interactive documentation generated from the live OpenAPI specification.</p>
        </div>
        <nav>
            <a href="/">Dashboard</a>
            <a href="/api/openapi.json">OpenAPI JSON</a>
        </nav>
    </header>

    <main>
        <aside>
            <label for="filter">Filter endpoints</label>
            <input id="filter" type="search" placeholder="track, sync, playlist…" autocomplete="off">
            <div id="endpoint-nav" aria-live="polite"></div>
        </aside>
        <section id="content">
            <div id="loading">Loading API specification…</div>
        </section>
    </main>

    <template id="operation-template">
        <article class="operation">
            <button class="operation-heading" type="button" aria-expanded="false">
                <span class="method"></span>
                <code class="path"></code>
                <span class="summary"></span>
                <span class="chevron">⌄</span>
            </button>
            <div class="operation-body" hidden>
                <p class="description"></p>
                <form class="try-form">
                    <div class="parameters"></div>
                    <label class="body-field" hidden>
                        JSON request body
                        <textarea rows="8" spellcheck="false"></textarea>
                    </label>
                    <label class="file-field" hidden>
                        Audio file
                        <input type="file" name="file">
                    </label>
                    <label class="token-field">
                        Bearer token <span>(optional)</span>
                        <input name="token" type="password" autocomplete="off" placeholder="api_token">
                    </label>
                    <div class="actions">
                        <button class="execute" type="submit">Execute</button>
                        <span class="request-url"></span>
                    </div>
                </form>
                <div class="response" hidden>
                    <div class="response-meta"></div>
                    <pre></pre>
                </div>
            </div>
        </article>
    </template>

    <script src="{{ url_for('static', filename='api-docs.js') }}" defer></script>
</body>
</html>
