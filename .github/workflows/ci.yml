name: CI

# Fast, dependency-light checks that run on the server for every push / PR.
# The heavy end-to-end suite (master + satellite containers) stays local via
# the pre-push hook — it needs Docker and a music library CI doesn't have.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Byte-compile + non-E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile all Python (syntax gate)
        run: |
          python - <<'PY'
          import compileall, sys
          ok = 1
          for target in ("src", "scripts", "tests"):
              ok &= compileall.compile_dir(target, quiet=1)
          ok &= compileall.compile_file("web_server.py", quiet=1)
          sys.exit(0 if ok else 1)
          PY

      - name: Install server deps + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server.txt pytest

      - name: Run full non-E2E suite
        run: pytest tests --ignore=tests/e2e -q

  desktop:
    name: Desktop frontend + Tauri tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop component tests
        working-directory: desktop
        run: npm test

      - name: Build desktop frontend
        working-directory: desktop
        run: npm run build

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile and test the Tauri shell
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
